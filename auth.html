<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Daily Tasks — Kyçja & Regjistrimi</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, #1e3a8a, #2563eb); padding: 16px;
    }
    .auth-card {
      background: #fff; width: 100%; max-width: 400px; padding: 32px;
      border-radius: 14px; box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }
    .auth-card h2 { margin: 0 0 6px; color: #1e3a8a; text-align: center; }
    .auth-card p.subtitle { margin: 0 0 22px; color: #64748b; text-align: center; font-size: 14px; }
    .tabs { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; }
    .tab {
      flex: 1; padding: 10px; text-align: center; cursor: pointer;
      font-weight: 600; color: #64748b; border-bottom: 2px solid transparent; margin-bottom: -2px;
    }
    .tab.active { color: #2563eb; border-bottom-color: #2563eb; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 5px; }
    input {
      width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px;
      font-size: 14px; outline: none; transition: border 0.2s;
    }
    input:focus { border-color: #2563eb; }
    button {
      width: 100%; padding: 11px; background: #2563eb; color: #fff; border: none;
      border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px;
    }
    button:hover { background: #1d4ed8; }
    .error-msg { color: #dc2626; font-size: 13px; margin-bottom: 12px; text-align: center; display: none; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h2>My Daily Tasks</h2>
    <p class="subtitle">Organizo detyrat e tua të përditshme</p>

    <div class="tabs">
      <div class="tab active" id="tab-login" onclick="switchTab('login')">Kyçu</div>
      <div class="tab" id="tab-register" onclick="switchTab('register')">Regjistrohu</div>
    </div>

    <div class="error-msg" id="error-box"></div>

    <form id="login-form">
      <div class="form-group">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" placeholder="emri@shembull.com" required />
      </div>
      <div class="form-group">
        <label for="login-password">Fjalëkalimi</label>
        <input type="password" id="login-password" placeholder="••••••••" required />
      </div>
      <button type="submit">Kyçu në llogari</button>
    </form>

    <form id="register-form" class="hidden">
      <div class="form-group">
        <label for="reg-name">Emri dhe Mbiemri</label>
        <input type="text" id="reg-name" placeholder="Filan Fisteku" required />
      </div>
      <div class="form-group">
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" placeholder="emri@shembull.com" required />
      </div>
      <div class="form-group">
        <label for="reg-password">Fjalëkalimi (min. 6 karaktere)</label>
        <input type="password" id="reg-password" minlength="6" placeholder="••••••••" required />
      </div>
      <button type="submit">Krijo llogari</button>
    </form>
  </div>

  <script src="auth.js"></script>
</body>
</html>
