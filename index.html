<!doctype html>
<html lang="sq">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7f7f5"><title>Ditari — Lista jote e detyrave</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'DM Sans',sans-serif;color:#20241f;background:#f7f7f5;font-synthesis:none;text-rendering:optimizeLegibility;--green:#436a4c;--muted:#82877f;--line:#e9e9e4}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.topbar{height:76px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;padding:0 max(26px,calc((100vw - 1000px)/2));background:#fbfbf9}.brand{display:flex;align-items:center;gap:11px;font-family:Manrope,sans-serif;font-size:18px;font-weight:800;letter-spacing:-.6px}.brand-mark{width:34px;height:34px;border-radius:11px;background:#456e4d;color:white;display:grid;place-items:center;font-size:17px}.user-bar{display:flex;align-items:center;gap:14px;color:#666d64;font-size:13px}.avatar{width:34px;height:34px;background:#e8ede6;color:#456e4d;border-radius:50%;display:grid;place-items:center;font-weight:700}.btn-logout{border:1px solid var(--line);background:white;padding:8px 12px;border-radius:9px;color:#656b63;font-size:12px}.container{width:min(800px,calc(100% - 40px));margin:48px auto 90px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;font-weight:700;color:#80917f}.page-heading{display:flex;align-items:end;justify-content:space-between;margin-bottom:26px}.page-heading h1{font:800 36px Manrope,sans-serif;letter-spacing:-1.5px;margin:8px 0 5px}.page-heading p{margin:0;color:var(--muted);font-size:14px}.today{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font-size:12px;color:#657063}.progress-card,.task-form,.task-item{background:#fff;border:1px solid var(--line);border-radius:15px}.progress-card{padding:19px 21px;margin-bottom:20px}.progress-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-size:13px;font-weight:600}.progress-header span:last-child{color:#748071;font-size:12px;font-weight:500}.progress-bg{background:#eff0ec;height:7px;border-radius:99px;overflow:hidden}.progress-fill{background:#608568;height:100%;width:0%;transition:width .3s;border-radius:99px}.form-heading{grid-column:span 2;font:700 15px Manrope,sans-serif;margin:0 0 2px}.task-form{padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:27px}.task-form input,.task-form select,.controls input,.controls select{width:100%;border:1px solid #e4e6df;border-radius:9px;background:#fff;color:#343a33;padding:11px 12px;font-size:13px;outline:none}.task-form input:focus,.task-form select:focus,.controls input:focus,.controls select:focus{border-color:#8da791;box-shadow:0 0 0 3px #edf2ed}.task-form input::placeholder,.controls input::placeholder{color:#a1a59e}.full-width{grid-column:span 2}.form-actions{grid-column:span 2;display:flex;gap:9px}.btn-add{background:#476f4f;color:white;border:0;padding:11px 17px;border-radius:9px;font-size:13px;font-weight:700}.btn-add:hover{background:#385b40}.cancel-edit{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:9px;color:#697067;font-size:13px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.section-title{font:700 17px Manrope,sans-serif;letter-spacing:-.3px}.count{font-size:11px;color:#848a82;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 10px}.controls{display:flex;gap:9px;margin-bottom:12px}.controls input{flex:1;min-width:130px}.controls select{width:auto;min-width:145px;color:#656b63}.task-list{display:flex;flex-direction:column;gap:9px}.task-item{padding:16px 17px;display:flex;align-items:center;gap:14px;transition:box-shadow .15s,border-color .15s}.task-item:hover{border-color:#daddd5;box-shadow:0 5px 16px #2736220a}.task-item.completed{background:#fcfcfb}.task-item.overdue{border-left:3px solid #c97a66}.task-check{flex:none;cursor:pointer;position:relative;width:20px;height:20px}.task-check input{opacity:0;width:20px;height:20px;position:absolute;inset:0;margin:0;cursor:pointer}.checkmark{display:block;width:20px;height:20px;border:1.5px solid #d4d9d1;border-radius:7px;pointer-events:none}.task-check input:checked+.checkmark{background:#608568;border-color:#608568}.task-check input:checked+.checkmark:after{content:'✓';color:#fff;display:grid;place-items:center;font-size:13px;font-weight:bold}.task-content{min-width:0;flex:1}.task-title{font-size:14px;font-weight:600;margin:0 0 4px;overflow-wrap:anywhere}.completed .task-title{text-decoration:line-through;color:#999e97}.task-desc{font-size:12px;line-height:1.5;color:#858b82;margin:0 0 7px;overflow-wrap:anywhere}.task-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:#878d84;font-size:11px}.meta-date.is-overdue{color:#b36552}.badge{padding:3px 8px;border-radius:99px;font-size:10px;font-weight:600}.prio-high{background:#f9ebe7;color:#a95240}.prio-medium{background:#f5f0e1;color:#967a37}.prio-low{background:#eaf0e9;color:#5c795f}.task-actions{display:flex;gap:5px}.icon-btn{border:0;background:transparent;color:#969b93;width:31px;height:31px;border-radius:8px;font-size:17px}.icon-btn:hover{background:#f1f3ef;color:#3c6344}.delete-btn{font-size:22px}.delete-btn:hover{background:#faf0ed;color:#b45341}.empty-state{padding:48px 18px;text-align:center;color:#858b82;border:1px dashed #dcdfd8;background:#fbfbf9;border-radius:14px}.empty-icon{margin:0 auto 13px;width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:#edf1eb;color:#55765c;font-size:20px}.empty-state strong{display:block;color:#434a42;font:700 14px Manrope,sans-serif;margin-bottom:5px}.empty-state span{font-size:12px}[hidden]{display:none!important}@media(max-width:600px){.topbar{height:65px;padding:0 18px}.user-bar{gap:9px}.container{width:calc(100% - 30px);margin:32px auto 60px}.page-heading{align-items:start}.page-heading h1{font-size:30px}.today{font-size:10px;padding:9px;margin-top:13px}.task-form{padding:16px;gap:10px}.controls{display:grid;grid-template-columns:1fr 1fr}.controls input{grid-column:span 2}.controls select{width:100%;min-width:0}.task-item{padding:13px 12px;gap:10px}.task-meta{gap:7px}.task-actions{gap:0}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><span class="brand-mark">✓</span>ditari</div><div class="user-bar"><span class="avatar" id="user-avatar">P</span><span id="welcome-user">Përdorues</span><button class="btn-logout" id="logout-btn">Dil nga llogaria</button></div></header>
  <main class="container">
    <div class="page-heading"><div><div class="eyebrow">HAPËSIRA JOTE E PUNËS</div><h1>Lista ime</h1><p>Një hap i vogël çdo ditë të çon larg.</p></div><div class="today" id="today-label"></div></div>
    <section class="progress-card"><div class="progress-header"><span>Progresi yt</span><span id="progress-text">0 / 0 të përfunduara (0%)</span></div><div class="progress-bg"><div class="progress-fill" id="progress-fill"></div></div></section>
    <form class="task-form" id="task-form"><h2 class="form-heading">Shto një detyrë të re</h2><input type="hidden" id="edit-id"><input type="text" id="task-title" class="full-width" placeholder="Çfarë duhet të bësh?" maxlength="120" required><input type="text" id="task-desc" class="full-width" placeholder="Shto një përshkrim të shkurtër (opsionale)" maxlength="300"><input type="date" id="task-date" aria-label="Afati i detyrës" required><select id="task-category" aria-label="Kategoria"><option value="Punë">Punë</option><option value="Shkollë">Shkollë</option><option value="Personale">Personale</option></select><select id="task-priority" class="full-width" aria-label="Prioriteti"><option value="medium">Prioriteti · Mesatar</option><option value="high">Prioriteti · I lartë</option><option value="low">Prioriteti · I ulët</option></select><div class="form-actions"><button type="submit" class="btn-add" id="submit-btn">+ Shto detyrën</button><button type="button" class="cancel-edit" id="cancel-edit" hidden>Anulo</button></div></form>
    <section><div class="section-head"><h2 class="section-title">Detyrat e mia</h2><span id="task-count" class="count">0 detyra</span></div><div class="controls"><input type="search" id="search-input" placeholder="⌕  Kërko në detyrat e tua..." aria-label="Kërko detyra"><select id="filter-status" aria-label="Filtro sipas statusit"><option value="all">Të gjitha detyrat</option><option value="active">Aktive</option><option value="completed">Të përfunduara</option></select><select id="sort-by" aria-label="Rendit detyrat"><option value="date">Sipas afatit</option><option value="priority">Sipas prioritetit</option></select></div><p id="app-message" role="alert" style="margin:0 0 12px;padding:12px 14px;background:#fbf0ed;border:1px solid #f0d5cc;border-radius:10px;color:#a34c3b;font-size:12px" hidden></p><div class="task-list" id="task-list"></div><div class="empty-state" id="empty-state"><div class="empty-icon">✳</div><strong>Lista jote është bosh</strong><span>Shto detyrën e parë dhe nis ditën me qartësi.</span></div></section>
  </main><script>const date=new Date();document.getElementById('today-label').textContent=date.toLocaleDateString('sq-AL',{weekday:'long',day:'numeric',month:'long'});</script><script src="app.js"></script>
</body></html>
