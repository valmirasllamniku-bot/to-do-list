<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Daily Tasks — Paneli Kryesor</title>
  <style>
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { margin: 0; background: #f1f5f9; color: #1e293b; }
    header {
      background: #1e3a8a; color: #fff; padding: 16px 24px;
      display: flex; justify-content: space-between; align-items: center;
    }
    header h1 { margin: 0; font-size: 20px; }
    .user-bar { display: flex; align-items: center; gap: 12px; font-size: 14px; }
    .btn-logout {
      background: #ef4444; color: #fff; border: none; padding: 7px 14px;
      border-radius: 6px; cursor: pointer; font-weight: 600;
    }
    .container { max-width: 820px; margin: 24px auto; padding: 0 16px; }
    
    /* Progress Bar (FR-09) */
    .progress-card {
      background: #fff; padding: 16px 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
    }
    .progress-header { display: flex; justify-content: space-between; font-weight: 600; margin-bottom: 8px; }
    .progress-bg { background: #e2e8f0; height: 10px; border-radius: 99px; overflow: hidden; }
    .progress-fill { background: #2563eb; height: 100%; width: 0%; transition: width 0.3s; }

    /* Forma e shtimit (FR-02) */
    .task-form {
      background: #fff; padding: 20px; border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 20px;
      display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }
    .task-form input, .task-form select {
      padding: 10px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; width: 100%;
    }
    .full-width { grid-column: span 2; }
    .btn-add {
      grid-column: span 2; background: #2563eb; color: #fff; border: none;
      padding: 11px; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    .btn-add:hover { background: #1d4ed8; }

    /* Kërkimi dhe Filtrimi (FR-07 & FR-08) */
    .controls {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 16px;
    }
    .controls input, .controls select {
      padding: 9px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: #fff; font-size: 14px;
    }
    .controls input { flex: 1; min-width: 180px; }

    /* Lista e detyrave (FR-03 deri FR-06) */
    .task-list { display: flex; flex-direction: column; gap: 10px; }
    .task-item {
      background: #fff; padding: 14px 18px; border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05); display: flex;
      justify-content: space-between; align-items: center; gap: 12px;
      border-left: 5px solid #2563eb;
    }
    .task-item.completed { opacity: 0.65; border-left-color: #10b981; }
    .task-item.completed .task-title { text-decoration: line-through; }
    .task-item.overdue { border-left-color: #dc2626; background: #fef2f2; }
    .task-left { display: flex; align-items: flex-start; gap: 12px; }
    .task-left input[type="checkbox"] { width: 18px; height: 18px; margin-top: 3px; cursor: pointer; }
    .task-title { font-weight: 600; font-size: 16px; margin: 0 0 4px; }
    .task-meta { font-size: 12px; color: #64748b; display: flex; gap: 10px; flex-wrap: wrap; }
    .badge { padding: 2px 8px; border-radius: 99px; font-weight: 600; font-size: 11px; }
    .prio-high { background: #fee2e2; color: #b91c1c; }
    .prio-medium { background: #fef3c7; color: #b45309; }
    .prio-low { background: #dbeafe; color: #1d4ed8; }
    .task-actions { display: flex; gap: 6px; }
    .btn-sm {
      border: none; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600;
    }
    .btn-edit { background: #e2e8f0; color: #1e293b; }
    .btn-del { background: #fee2e2; color: #dc2626; }
    @media (max-width: 600px) {
      .task-form { grid-template-columns: 1fr; }
      .full-width, .btn-add { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <header>
    <h1>My Daily Tasks</h1>
    <div class="user-bar">
      <span id="welcome-user">Përdorues</span>
      <button class="btn-logout" onclick="logout()">Dil</button>
    </div>
  </header>

  <div class="container">
    <!-- Progresi ditor -->
    <div class="progress-card">
      <div class="progress-header">
        <span>Progresi i detyrave</span>
        <span id="progress-text">0 / 0 të përfunduara (0%)</span>
      </div>
      <div class="progress-bg">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- Forma për shtim / editim -->
    <form class="task-form" id="task-form">
      <input type="hidden" id="edit-id" />
      <input type="text" id="task-title" class="full-width" placeholder="Titulli i detyrës (p.sh. Përfundo raportin)..." required />
      <input type="text" id="task-desc" class="full-width" placeholder="Përshkrimi opsional..." />
      <input type="date" id="task-date" required />
      <select id="task-category">
        <option value="Punë">Kategoria: Punë</option>
        <option value="Shkollë">Kategoria: Shkollë</option>
        <option value="Personale">Kategoria: Personale</option>
      </select>
      <select id="task-priority" class="full-width">
        <option value="medium">Prioriteti: Mesatar</option>
        <option value="high">Prioriteti: I lartë</option>
        <option value="low">Prioriteti: I ulët</option>
      </select>
      <button type="submit" class="btn-add" id="submit-btn">+ Shto Detyrën</button>
    </form>

    <!-- Kërkimi dhe filtrat -->
    <div class="controls">
      <input type="text" id="search-input" placeholder="Kërko detyrë..." oninput="renderTasks()" />
      <select id="filter-status" onchange="renderTasks()">
        <option value="all">Statusi: Të gjitha</option>
        <option value="active">Aktive</option>
        <option value="completed">Të përfunduara</option>
      </select>
      <select id="sort-by" onchange="renderTasks()">
        <option value="date">Rendit: Sipas Afatit</option>
        <option value="priority">Rendit: Sipas Prioritetit</option>
      </select>
    </div>

    <!-- Lista e detyrave -->
    <div class="task-list" id="task-list"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
